name: Production deployment checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-builds:
    runs-on: ubuntu-latest
    env:
      RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      RENDER_SCANNER_DEPLOY_HOOK: ${{ secrets.RENDER_SCANNER_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run lint
          npm run type-check
          npm run test:run
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CARD_SCANNER_API_URL: ${{ secrets.VITE_CARD_SCANNER_API_URL }}
          VITE_ENABLE_AUTH: 'true'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: |
          npm run lint
          npm run test:run
          npm run build
        env:
          NODE_ENV: test
          JWT_SECRET: github-actions-test-secret-at-least-32-characters

      - name: Deployment handoff
        run: |
          echo "Cloudflare Pages and both Render services deploy from Git after this push."
          echo "Production frontend: https://tcgtracker-9oc.pages.dev/"

      - name: Trigger Render API deploy hook
        if: ${{ env.RENDER_API_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK"

      - name: Trigger Render scanner deploy hook
        if: ${{ env.RENDER_SCANNER_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_SCANNER_DEPLOY_HOOK"
