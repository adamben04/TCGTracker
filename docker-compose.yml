version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcgtracker-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/tcg-prices.db
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend-data:/app/data
      - ./backend/.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - tcgtracker-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ''
    container_name: tcgtracker-frontend
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tcgtracker-network

  card-scanner:
    build:
      context: ./card-scanner-backend
      dockerfile: Dockerfile
    container_name: tcgtracker-scanner
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - FLASK_DEBUG=false
    restart: unless-stopped
    networks:
      - tcgtracker-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  backend-data:
    driver: local

networks:
  tcgtracker-network:
    driver: bridge
